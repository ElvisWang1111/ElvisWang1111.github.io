<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - Temporarily Hidden</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="0; url=../index.html" />
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --link: #0066cc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Temporarily Hidden</h1>
    <p>Blog 页面暂时关闭，后续会重新开放。</p>
    <a href="../index.html">Back to Homepage</a>
  </main>
</body>
</html>
